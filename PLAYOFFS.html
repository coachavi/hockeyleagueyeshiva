<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Playoff Bracket</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #c0c0c0 0%, #d9d9d9 25%, #a6a6a6 50%, #d9d9d9 75%, #c0c0c0 100%);
      background-size: 400% 400%;
      animation: shine 10s ease-in-out infinite;
    }

    @keyframes shine {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    .bracket {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 60px;
      align-items: center;
      text-align: center;
      background-color: rgba(255, 255, 255, 0.8);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    .team {
      background-color: #ffffff;
      border: 2px solid #ccc;
      border-radius: 10px;
      padding: 15px 20px;
      margin: 20px 0;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 15px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
    }

    .team img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .column {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .center img {
      width: 120px;
      height: auto;
    }

    @media (max-width: 768px) {
      .bracket {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .team {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div class="bracket">
    <!-- Left Side -->
    <div class="column">
      <div class="team">
        <img src="helicopter.png" alt="Helicopter Logo">
        ELICOPTERS
      </div>
      <div class="team">
        <img src="shtinkle.png" alt="Shtinkle Logo">
        SHTINKLEMACHERS
      </div>
    </div>

    <!-- Center Stanley Cup -->
    <div class="center">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5d/Stanley_Cup.jpg/220px-Stanley_Cup.jpg" alt="Stanley Cup">
    </div>

    <!-- Right Side -->
    <div class="column">
      <div class="team">
        <img src="770.png" alt="770 Logo">
        770 TUNNEL DIGGERS
      </div>
      <div class="team">
        <img src="smashers.png" alt="Smashers Logo">
        ISRAEL SMASHERS
      </div>
    </div>
  </div>

</body>
</html>
