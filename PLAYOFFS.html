<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Playoff Bracket</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: #C0C0C0;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .bracket-container {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .round {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 60px;
      position: relative;
    }

    .matchup {
      display: flex;
      align-items: center;
      position: relative;
      height: 80px;
    }

    .team-box {
      display: flex;
      align-items: center;
      background-color: #222;
      border: 2px solid #888;
      border-radius: 10px;
      padding: 8px 14px;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 0 8px #444;
      min-width: 180px;
      z-index: 2;
      color: white;
    }

    .team-box img {
      width: 32px;
      height: 32px;
      margin-right: 8px;
      object-fit: contain;
      filter: drop-shadow(0 0 2px black);
    }

    .score-boxes {
      display: flex;
      gap: 4px;
      margin-right: 10px;
    }

    .score-box {
      background-color: #444;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: normal;
      box-shadow: 0 0 3px #222;
    }

    .connector {
      position: absolute;
      height: 3px;
      background-color: white;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1;
    }

    .connector-right {
      right: -80px;
      width: 80px;
    }

    .connector-left {
      left: -80px;
      width: 80px;
    }

    .merge-line {
      position: absolute;
      width: 3px;
      height: 150px;
      background-color: white;
      top: calc(50% - 75px);
      z-index: 0;
    }

    .merge-line-left {
      right: -80px;
    }

    .merge-line-right {
      left: -80px;
    }

    .center {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      position: relative;
      margin: 40px 0;
    }

    .final-line-left,
    .final-line-right {
      width: 16px;
      height: 3px;
      background-color: white;
      position: relative;
      z-index: 10;
    }

    .final-line-left {
      margin-left: 80px;
    }

    .final-line-right {
      margin-right: 80px;
    }

    .stanley-cup-wrapper {
      position: relative;
      width: 160px;
      height: auto;
    }

    .stanley-cup {
      width: 100%;
      filter: drop-shadow(0 0 6px white);
    }

    .champion-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 140px;
      height: 140px;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 0 6px black);
    }

    /* New Award Section Styles */
    .awards-section {
      display: flex;
      gap: 40px;
      margin-top: 60px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .award-box {
      background: linear-gradient(145deg, #FFD700, #FFEF8A);
      color: black;
      padding: 20px 24px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 12px #555;
      font-size: 20px;
      font-weight: bold;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-width: 140px;
      cursor: pointer; /* show pointer on hover */
      transition: transform 0.2s ease;
    }
    .award-box:hover {
      transform: scale(1.05);
    }

    .award-box img {
      width: 80px;
      height: 80px;
      margin: 12px 0 8px 0;
      object-fit: contain;
      filter: drop-shadow(0 0 4px #333);
    }

    .award-name {
      font-weight: normal;
      font-size: 16px;
      margin-top: 0;
      text-align: center;
      color: black;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 30px;
      font-weight: bold;
      color: white;
      text-decoration: none;
      font-size: 16px;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    /* Modal Styles */
    .modal {
      display: none; /* Hidden by default */
      position: fixed;
      z-index: 1000;
      padding-top: 60px;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.8);
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      position: relative;
      max-width: 90%;
      max-height: 90%;
      animation: zoomIn 0.3s ease forwards;
    }

    .modal-content img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 0 20px #fff;
      display: block;
      margin: 0 auto;
    }

    .close-btn {
      position: absolute;
      top: 8px;
      right: 12px;
      color: white;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      text-shadow: 0 0 6px black;
    }

    @keyframes zoomIn {
      from {
        opacity: 0;
        transform: scale(0.7);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>

  <div class="bracket-container">

    <!-- Left Side -->
    <div class="round">
      <div class="matchup">
        <div class="team-box">
          <div class="score-boxes">
            <span class="score-box">0</span>
            <span class="score-box">3</span>
            <span class="score-box">0</span>
          </div>
          ELICOPTERS
        </div>
        <div class="connector connector-right"></div>
      </div>

      <div class="matchup">
        <div class="team-box">
          <div class="score-boxes">
            <span class="score-box">4</span>
            <span class="score-box">2</span>
            <span class="score-box">1</span>
          </div>
          SHTINKLEMACHERS
        </div>
        <div class="connector connector-right"></div>
      </div>

      <div class="merge-line merge-line-left"></div>
    </div>

    <!-- Center Stanley Cup Final Matchup -->
    <div class="center">
      <div class="team-box">
        <div class="score-boxes">
          <span class="score-box">2</span>
          <span class="score-box">5</span>
          <span class="score-box">1</span>
        </div>
        SHTINKLEMACHERS
      </div>

      <div class="stanley-cup-wrapper">
        <img src="InShot_20250616_232552058.jpg" alt="Stanley Cup" class="stanley-cup" />
        <img src="770.png" alt="770 Logo" class="champion-logo" />
      </div>

      <div class="team-box">
        <div class="score-boxes">
          <span class="score-box">3</span>
          <span class="score-box">2</span>
          <span class="score-box">5</span>
        </div>
        770 TUNNEL DIGGERS
      </div>
    </div>

    <!-- Right Side -->
    <div class="round">
      <div class="matchup">
        <div class="connector connector-left"></div>
        <div class="team-box">
          <div class="score-boxes">
            <span class="score-box">4</span>
            <span class="score-box">4</span>
          </div>
          770 TUNNEL DIGGERS
        </div>
      </div>

      <div class="matchup">
        <div class="connector connector-left"></div>
        <div class="team-box">
          <div class="score-boxes">
            <span class="score-box">1</span>
            <span class="score-box">1</span>
          </div>
          ISRAEL SMASHERS
        </div>
      </div>

      <div class="merge-line merge-line-right"></div>
    </div>

  </div>

  <!-- Awards Section -->
  <div class="awards-section">
    <div class="award-box" data-img="mvp.png" tabindex="0" role="button" aria-label="View MVP image">
      MVP
      <img src="mvp.png" alt="MVP Award" />
      <p class="award-name">S.AZOULAY</p>
    </div>
    <div class="award-box" data-img="goalie.png" tabindex="0" role="button" aria-label="View Best Goalie image">
      BEST GOALIE
      <img src="goalie.png" alt="Best Goalie Award" />
      <p class="award-name">L.PERLSTEIN</p>
    </div>
  </div>

  <a class="back-link" href="home.html">← Back to Home</a>

  <!-- Modal -->
  <div id="imgModal" class="modal" aria-hidden="true" role="dialog" aria-modal="true">
    <span class="close-btn" id="closeModal" aria-label="Close modal">&times;</span>
    <div class="modal-content">
      <img id="modalImage" src="" alt="Large award image" />
    </div>
  </div>

  <script>
    const modal = document.getElementById('imgModal');
    const modalImg = document.getElementById('modalImage');
    const closeBtn = document.getElementById('closeModal');

    // Open modal on award-box click
    document.querySelectorAll('.award-box').forEach(box => {
      box.addEventListener('click', () => {
        const imgSrc = box.getAttribute('data-img');
        modalImg.src = imgSrc;
        modal.style.display = 'flex';
        modal.setAttribute('aria-hidden', 'false');
        // Focus close button for accessibility
        closeBtn.focus();
      });
      // Also open on keyboard Enter or Space
      box.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          box.click();
        }
      });
    });

    // Close modal function
    function closeModalFunc() {
      modal.style.display = 'none';
      modal.setAttribute('aria-hidden', 'true');
      modalImg.src = '';
    }

    // Close modal on close button click
    closeBtn.addEventListener('click', closeModalFunc);

    // Close modal if clicking outside the image
    modal.addEventListener('click', (e) => {
      if(e.target === modal) {
        closeModalFunc();
      }
    });

    // Close modal on ESC key
    document.addEventListener('keydown', (e) => {
      if(e.key === 'Escape' && modal.style.display === 'flex') {
        closeModalFunc();
      }
    });
  </script>

</body>
</html>
