<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Playoff Bracket</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #c0c0c0 0%, #d9d9d9 25%, #a6a6a6 50%, #d9d9d9 75%, #c0c0c0 100%);
      background-size: 400% 400%;
      animation: shine 10s ease-in-out infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes shine {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .bracket-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
    }

    .round {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 80px;
      position: relative;
    }

    .matchup {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    .team-box {
      display: flex;
      align-items: center;
      background-color: white;
      border: 2px solid #ccc;
      border-radius: 10px;
      padding: 12px 20px;
      font-weight: bold;
      font-size: 20px;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
      min-width: 220px;
    }

    .team-box img {
      width: 45px;
      height: 45px;
      margin-right: 12px;
      object-fit: contain;
    }

    .connector {
      position: absolute;
      width: 40px;
      height: 2px;
      background-color: black;
      right: -40px;
      top: 50%;
      transform: translateY(-50%);
    }

    .connector-left {
      left: -40px;
      right: auto;
    }

    .center {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
    }

    .stanley-cup {
      width: 180px;
      height: auto;
    }

    .final-connector {
      width: 60px;
      height: 2px;
      background-color: black;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 40px;
      font-weight: bold;
      color: black;
      text-decoration: none;
      font-size: 18px;
    }

    @media (max-width: 768px) {
      .bracket-container {
        flex-direction: column;
        gap: 40px;
      }

      .round {
        flex-direction: row;
      }

      .connector,
      .connector-left,
      .final-connector {
        display: none;
      }

      .team-box {
        font-size: 16px;
        min-width: unset;
      }
    }
  </style>
</head>
<body>

  <div class="bracket-container">
    
    <!-- Left Side -->
    <div class="round">
      <div class="matchup">
        <div class="team-box">
          <img src="elicopter.png" alt="Helicopter Logo">
          ELICOPTERS
        </div>
        <div class="connector"></div>
      </div>

      <div class="matchup">
        <div class="team-box">
          <img src="shtinkle.png" alt="Shtinkle Logo">
          SHTINKLEMACHERS
        </div>
        <div class="connector"></div>
      </div>
    </div>

    <!-- Center: Final Round with Cup and Lines -->
    <div class="center">
      <div class="final-connector"></div>
      <img src="InShot_20250616_232552058.jpg" alt="Stanley Cup" class="stanley-cup">
      <div class="final-connector"></div>
    </div>

    <!-- Right Side -->
    <div class="round">
      <div class="matchup">
        <div class="connector connector-left"></div>
        <div class="team-box">
          <img src="770.png" alt="770 Logo">
          770 TUNNEL DIGGERS
        </div>
      </div>

      <div class="matchup">
        <div class="connector connector-left"></div>
        <div class="team-box">
          <img src="smashers.png" alt="Smashers Logo">
          ISRAEL SMASHERS
        </div>
      </div>
    </div>

  </div>

  <!-- Back to Home -->
  <a class="back-link" href="home.html">← Back to Home</a>

</body>
</html>
