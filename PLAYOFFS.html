<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Playoff Bracket</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #c0c0c0 0%, #d9d9d9 25%, #a6a6a6 50%, #d9d9d9 75%, #c0c0c0 100%);
      background-size: 400% 400%;
      animation: shine 10s ease-in-out infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes shine {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .bracket-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
    }

    .round {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 80px;
      position: relative;
    }

    .matchup {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    .team-box {
      display: flex;
      align-items: center;
      background-color: white;
      border: 2px solid #ccc;
      border-radius: 10px;
      padding: 10px 15px;
      font-weight: bold;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
      min-width: 200px;
    }

    .team-box img {
      width: 40px;
      height: 40px;
      margin-right: 10px;
      object-fit: contain;
    }

    .connector {
      position: absolute;
      width: 40px;
      height: 2px;
      background-color: black;
      right: -40px;
      top: 50%;
      transform: translateY(-50%);
    }

    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
    }

    .stanley-cup {
      width: 120px;
      height: auto;
    }

    .vertical-line {
      width: 2px;
      height: 160px;
      background-color: black;
      margin: -40px 0;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 40px;
      font-weight: bold;
      color: black;
      text-decoration: none;
      font-size: 18px;
    }

    @media (max-width: 768px) {
      .bracket-container {
        flex-direction: column;
      }

      .round {
        flex-direction: row;
      }

      .connector {
        display: none;
      }

      .vertical-line {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="bracket-container">
    
    <!-- Left Side -->
    <div class="round">
      <div class="matchup">
        <div class="team-box">
          <img src="helicopter.png" alt="Helicopter Logo">
          ELICOPTERS
        </div>
        <div class="connector"></div>
      </div>

      <div class="matchup">
        <div class="team-box">
          <img src="shtinkle.png" alt="Shtinkle Logo">
          SHTINKLEMACHERS
        </div>
        <div class="connector"></div>
      </div>
    </div>

    <!-- Center Cup -->
    <div class="center">
      <div class="vertical-line"></div>
      <img src="InShot_20250616_232552058.jpg" alt="Stanley Cup" class="stanley-cup">
      <div class="vertical-line"></div>
    </div>

    <!-- Right Side -->
    <div class="round">
      <div class="matchup">
        <div class="connector" style="left: -40px; right: auto;"></div>
        <div class="team-box">
          <img src="770.png" alt="770 Logo">
          770 TUNNEL DIGGERS
        </div>
      </div>

      <div class="matchup">
        <div class="connector" style="left: -40px; right: auto;"></div>
        <div class="team-box">
          <img src="smashers.png" alt="Smashers Logo">
          ISRAEL SMASHERS
        </div>
      </div>
    </div>

  </div>

  <!-- Back to Home link -->
  <a class="back-link" href="home.html">← Back to Home</a>

</body>
</html>
