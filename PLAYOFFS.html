<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Playoff Bracket</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: Arial, sans-serif;
      background-color: #C0C0C0;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .bracket-container {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .round {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 80px;
      position: relative;
    }

    .matchup {
      display: flex;
      align-items: center;
      position: relative;
      height: 100px;
    }

    .team-box {
      display: flex;
      align-items: center;
      background-color: #222; /* dark but visible on black */
      border: 2px solid #888;
      border-radius: 10px;
      padding: 12px 20px;
      font-weight: bold;
      font-size: 20px;
      box-shadow: 0 0 10px #444;
      min-width: 240px;
      z-index: 2;
      color: white;
    }

    .team-box img {
      width: 45px;
      height: 45px;
      margin-right: 12px;
      object-fit: contain;
      filter: drop-shadow(0 0 2px black);
    }

    .connector {
      position: absolute;
      height: 4px;
      background-color: white;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1;
    }

    .connector-right {
      right: -100px;
      width: 100px;
    }

    .connector-left {
      left: -100px;
      width: 100px;
    }

    .merge-line {
      position: absolute;
      width: 4px;
      height: 180px;
      background-color: white;
      top: calc(50% - 90px);
      z-index: 0;
    }

    .merge-line-left {
      right: -100px;
    }

    .merge-line-right {
      left: -100px;
    }

    .center {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0px;
      position: relative;
    }

    .final-line-left {
      width: 20px;
      height: 4px;
      background-color: white;
      position: relative;
      z-index: 10;
      margin-left: 100px;
    }

    .final-line-right {
      width: 20px;
      height: 4px;
      background-color: white;
      position: relative;
      z-index: 10;
      margin-right: 100px;
    }

    .stanley-cup {
      width: 200px;
      height: auto;
      filter: drop-shadow(0 0 6px white);
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 40px;
      font-weight: bold;
      color: white;
      text-decoration: none;
      font-size: 18px;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="bracket-container">

    <!-- Left Side -->
    <div class="round">
      <div class="matchup">
        <div class="team-box">
          <img src="elicopter.png" alt="Elicopter Logo" />
          0 3 0 &nbsp; ELICOPTERS
        </div>
        <div class="connector connector-right"></div>
      </div>

      <div class="matchup">
        <div class="team-box">
          <img src="shtinkle.png" alt="Shtinkle Logo" />
          4 2 1 &nbsp; SHTINKLEMACHERS
        </div>
        <div class="connector connector-right"></div>
      </div>

      <div class="merge-line merge-line-left"></div>
    </div>

    <!-- Center Stanley Cup -->
    <div class="center">
      <div class="final-line-left"></div>
      <img src="InShot_20250616_232552058.jpg" alt="Stanley Cup" class="stanley-cup" />
      <div class="final-line-right"></div>
    </div>

    <!-- Right Side -->
    <div class="round">
      <div class="matchup">
        <div class="connector connector-left"></div>
        <div class="team-box">
          <img src="770.png" alt="770 Logo" />
          4 4 &nbsp; 770 TUNNEL DIGGERS
        </div>
      </div>

      <div class="matchup">
        <div class="connector connector-left"></div>
        <div class="team-box">
          <img src="smashers.png" alt="Smashers Logo" />
          1 1 &nbsp; ISRAEL SMASHERS
        </div>
      </div>

      <div class="merge-line merge-line-right"></div>
    </div>

  </div>

  <a class="back-link" href="home.html">← Back to Home</a>

</body>
</html>
