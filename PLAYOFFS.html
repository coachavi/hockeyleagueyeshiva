<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Playoff Bracket</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #c0c0c0 0%, #d9d9d9 25%, #a6a6a6 50%, #d9d9d9 75%, #c0c0c0 100%);
      background-size: 400% 400%;
      animation: shine 10s ease-in-out infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes shine {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .bracket-container {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .round {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 80px;
      position: relative;
    }

    .matchup {
      display: flex;
      align-items: center;
      position: relative;
      height: 100px;
    }

    .team-box {
      display: flex;
      align-items: center;
      background-color: white;
      border: 2px solid #ccc;
      border-radius: 10px;
      padding: 12px 20px;
      font-weight: bold;
      font-size: 20px;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
      min-width: 240px;
      z-index: 2;
    }

    .team-box img {
      width: 45px;
      height: 45px;
      margin-right: 12px;
      object-fit: contain;
    }

    .connector {
      position: absolute;
      height: 4px;
      background-color: black;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1;
    }

    .connector-right {
      right: -100px;
      width: 100px;
    }

    .connector-left {
      left: -100px;
      width: 100px;
    }

    .merge-line {
      position: absolute;
      width: 4px;
      height: 180px;
      background-color: black;
      top: calc(50% - 90px);
      z-index: 0;
    }

    .merge-line-left {
      right: -100px;
    }

    .merge-line-right {
      left: -100px;
    }

    .center {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0px;
      position: relative;
    }

    .final-line {
      width: 100px;
      height: 4px;
      background-color: black;
    }

    .final-left {
      margin-right: 40px;
    }

    .final-right {
      margin-left: 40px;
    }

    .stanley-cup {
      width: 200px;
      height: auto;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 40px;
      font-weight: bold;
      color: black;
      text-decoration: none;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="bracket-container">

    <!-- Left Side -->
    <div class="round">
      <div class="matchup">
        <div class="team-box">
          <img src="elicopter.png" alt="Elicopter Logo">
          ELICOPTERS
        </div>
        <div class="connector connector-right"></div>
      </div>

      <div class="matchup">
        <div class="team-box">
          <img src="shtinkle.png" alt="Shtinkle Logo">
          SHTINKLEMACHERS
        </div>
        <div class="connector connector-right"></div>
      </div>

      <div class="merge-line merge-line-left"></div>
    </div>

    <!-- Center Stanley Cup -->
    <div class="center">
      <div class="final-line final-left"></div>
      <img src="InShot_20250616_232552058.jpg" alt="Stanley Cup" class="stanley-cup">
      <div class="final-line final-right"></div>
    </div>

    <!-- Right Side -->
    <div class="round">
      <div class="matchup">
        <div class="connector connector-left"></div>
        <div class="team-box">
          <img src="770.png" alt="770 Logo">
          770 TUNNEL DIGGERS
        </div>
      </div>

      <div class="matchup">
        <div class="connector connector-left"></div>
        <div class="team-box">
          <img src="smashers.png" alt="Smashers Logo">
          ISRAEL SMASHERS
        </div>
      </div>

      <div class="merge-line merge-line-right"></div>
    </div>

  </div>

  <a class="back-link" href="home.html">&larr; Back to Home</a>

  </body>
</html>
